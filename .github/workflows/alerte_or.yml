name: Alerte or

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Vérifier le prix de l'or
        run: python alerte_or_cloud.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Sauvegarder l'état
        run: |
          git config user.name "alerte-bot"
          git config user.email "alerte-bot@users.noreply.github.com"
          git add etat.json
          git diff --cached --quiet || (git commit -m "maj état" && git push)
